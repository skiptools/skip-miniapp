name: skip-miniapp
on:
  push:
    branches: [ main ]
    tags: "[0-9]+.[0-9]+.[0-9]+"
  schedule:
    - cron:  '0 14 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  call-workflow:
    uses: skiptools/actions/.github/workflows/skip-framework.yml@v1
    with:
      run-android-native-build: false
      # needed to be able to run e2e tests on Android emulator
      emulator-target: 'google_apis'
      emulator-api-level: 31
